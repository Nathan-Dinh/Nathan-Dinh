    .card { fill: #ffffff; stroke: #d9d3c8; }
    .title { font-size: 18px; font-weight: 700; }
    .label { font-size: 14px; fill: #6b655c; }
    .value { font-size: 14px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
        text { fill: #e6edf3; }
        .card { fill: #0d1117; stroke: #30363d; }
        .label { fill: #9198a1; }
    }
</style>
